<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talk One-Click</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #222536;
      --border: #2e3248;
      --accent: #6c63ff;
      --accent-hover: #7b73ff;
      --text: #e2e4ef;
      --muted: #7a7f9a;
      --ok: #22c55e;
      --partial: #f59e0b;
      --error: #ef4444;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    header span {
      font-size: 13px;
      color: var(--muted);
      margin-left: 4px;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 28px 32px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    section h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 20px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }

    label .req { color: var(--error); margin-left: 2px; }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus { border-color: var(--accent); }

    textarea { resize: vertical; min-height: 72px; }

    select { cursor: pointer; }
    select option { background: var(--surface2); }

    .btn {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
      margin-top: 8px;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result panel */
    #result-panel { display: flex; flex-direction: column; gap: 16px; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 10px;
      min-height: 200px;
    }

    .empty-state svg { opacity: .3; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .badge.ok    { background: rgba(34,197,94,.15);  color: var(--ok); }
    .badge.partial { background: rgba(245,158,11,.15); color: var(--partial); }
    .badge.error { background: rgba(239,68,68,.15);  color: var(--error); }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .timer { font-size: 12px; color: var(--muted); }

    .counters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .counter-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .counter-card .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .counter-card .value { font-size: 22px; font-weight: 700; }
    .counter-card .value.bool-true  { color: var(--ok); }
    .counter-card .value.bool-false { color: var(--error); }

    .block-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .sector-list, .error-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sector-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .sector-item .sector-name { font-weight: 500; }
    .sector-item .sector-id  { color: var(--muted); font-size: 11px; font-family: monospace; }

    .error-item {
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 13px;
    }

    .error-item .error-step { font-weight: 600; color: var(--error); margin-bottom: 2px; }
    .error-item .error-msg  { color: var(--text); opacity: .8; }

    details {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    details summary {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }

    details summary::before {
      content: '▶';
      font-size: 10px;
      transition: transform .2s;
    }

    details[open] summary::before { transform: rotate(90deg); }

    details pre {
      padding: 14px;
      font-size: 12px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      overflow-x: auto;
      color: var(--text);
      border-top: 1px solid var(--border);
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.6;
    }

    .channel-id-row {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 12px;
      font-family: monospace;
      color: var(--muted);
      word-break: break-all;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      header { padding: 14px 20px; }
      main { padding: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">T</div>
  <h1>Talk One-Click</h1>
  <span>/ onboarding</span>
</header>

<main>
  <!-- ── Formulário ── -->
  <section>
    <h2>Configuração</h2>
    <form id="form">

      <div class="field">
        <label>Nome do negócio <span class="req">*</span></label>
        <input type="text" id="business_name" required placeholder="Ex: Studio Bella" />
      </div>

      <div class="field">
        <label>Segmento <span class="req">*</span></label>
        <select id="segment" required>
          <option value="beleza">Beleza</option>
          <option value="saude">Saúde</option>
          <option value="ecommerce">E-commerce</option>
          <option value="educacao">Educação</option>
        </select>
      </div>

      <div class="field">
        <label>Objetivo principal <span class="req">*</span></label>
        <textarea id="goal" required placeholder="Ex: Agendar consultas e tirar dúvidas"></textarea>
      </div>

      <div class="field">
        <label>Volume de atendimento</label>
        <input type="text" id="volume" placeholder="Ex: alto, médio, baixo" />
      </div>

      <div class="field">
        <label>Abordagem</label>
        <textarea id="approach" placeholder="Ex: consultivo, direto, informal"></textarea>
      </div>

      <div class="field">
        <label>Talk API Key <span class="req">*</span></label>
        <input type="text" id="talk_api_key" required placeholder="sua-api-key" />
      </div>

      <div class="field">
        <label>Organization ID <span class="req">*</span></label>
        <input type="text" id="organization_id" required placeholder="seu-organization-id" />
      </div>

      <div class="field">
        <label>Nome do canal WhatsApp (opcional)</label>
        <input type="text" id="channel_name" placeholder="Ex: WhatsApp Atendimento" />
      </div>

      <div class="field">
        <label>Fluxo padrão do chatbot</label>
        <select id="chatbot_flow">
          <option value="collect">Collect (coleta nome e e-mail)</option>
          <option value="menu">Menu (opções por setor)</option>
          <option value="welcome_only">Welcome Only (só boas-vindas)</option>
        </select>
      </div>

      <div class="field">
        <label>Descreva o chatbot customizado <span style="color:var(--muted)">(opcional — sobrepõe o fluxo padrão)</span></label>
        <textarea id="chatbot_description" style="min-height:100px"
          placeholder="Ex: Receba o cliente com uma mensagem de boas-vindas, pergunte se é agendamento ou dúvida, e encaminhe para o setor correspondente. Finalize com uma mensagem de despedida."></textarea>
      </div>

      <button class="btn" type="submit" id="submit-btn">Iniciar Onboarding</button>
    </form>
  </section>

  <!-- ── Resultado ── -->
  <section>
    <h2>Resultado</h2>
    <div id="result-panel">
      <div class="empty-state">
        <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <p style="font-size:14px">Execute o onboarding para ver o resultado</p>
      </div>
    </div>
  </section>
</main>

<script>
  const LS_KEY_API  = 'talk_api_key';
  const LS_KEY_ORG  = 'talk_org_id';

  // Restore from localStorage
  const savedKey = localStorage.getItem(LS_KEY_API);
  const savedOrg = localStorage.getItem(LS_KEY_ORG);
  if (savedKey) document.getElementById('talk_api_key').value = savedKey;
  if (savedOrg) document.getElementById('organization_id').value = savedOrg;

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Processando…';

    const apiKey = document.getElementById('talk_api_key').value.trim();
    const orgId  = document.getElementById('organization_id').value.trim();
    localStorage.setItem(LS_KEY_API, apiKey);
    localStorage.setItem(LS_KEY_ORG, orgId);

    const body = {
      business_name:       document.getElementById('business_name').value.trim(),
      segment:             document.getElementById('segment').value,
      goal:                document.getElementById('goal').value.trim(),
      volume:              document.getElementById('volume').value.trim() || undefined,
      approach:            document.getElementById('approach').value.trim() || undefined,
      talk_api_key:        apiKey,
      organization_id:     orgId,
      chatbot_flow:        document.getElementById('chatbot_flow').value,
    };

    const channelName = document.getElementById('channel_name').value.trim();
    if (channelName) body.channel_name = channelName;

    const desc = document.getElementById('chatbot_description').value.trim();
    if (desc) body.chatbot_description = desc;

    // Remove undefined keys
    Object.keys(body).forEach(k => body[k] === undefined && delete body[k]);

    const t0 = performance.now();
    let data, elapsed, isError = false;

    try {
      const res = await fetch('http://127.0.0.1:8000/onboarding', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      elapsed = Math.round(performance.now() - t0);
      data = await res.json();
    } catch (err) {
      elapsed = Math.round(performance.now() - t0);
      data = { status: 'error', errors: [{ step: 'network', error: err.message }] };
      isError = true;
    }

    renderResult(data, elapsed);

    btn.disabled = false;
    btn.textContent = 'Iniciar Onboarding';
  });

  function renderResult(data, elapsed) {
    const panel = document.getElementById('result-panel');

    const status = data.status || 'error';
    const statusLabel = { ok: '✓ OK', partial: '⚠ Parcial', error: '✗ Erro' }[status] || status;

    const sectors = data.sectors || [];
    const errors  = data.errors  || [];
    const channelId = data.channel_id || null;

    let html = `
      <div class="result-header">
        <span class="badge ${status}"><span class="dot"></span>${statusLabel}</span>
        <span class="timer">${elapsed} ms</span>
      </div>

      <div class="counters">
        <div class="counter-card">
          <div class="label">Setores criados</div>
          <div class="value">${data.sectors_created ?? 0}</div>
        </div>
        <div class="counter-card">
          <div class="label">Etiquetas criadas</div>
          <div class="value">${data.labels_created ?? 0}</div>
        </div>
        <div class="counter-card">
          <div class="label">Chatbot criado</div>
          <div class="value ${data.chatbot_created ? 'bool-true' : 'bool-false'}">
            ${data.chatbot_created ? '✓' : '✗'}
          </div>
        </div>
        <div class="counter-card">
          <div class="label">Canal ID</div>
          <div class="value" style="font-size:12px;font-family:monospace;word-break:break-all;color:${channelId ? 'var(--ok)' : 'var(--muted)'}">
            ${channelId || '—'}
          </div>
        </div>
      </div>
    `;

    if (sectors.length > 0) {
      html += `<div>
        <div class="block-title">Setores</div>
        <div class="sector-list">
          ${sectors.map(s => `
            <div class="sector-item">
              <span class="sector-name">${esc(s.name)}</span>
              <span class="sector-id">${esc(s.id)}</span>
            </div>`).join('')}
        </div>
      </div>`;
    }

    if (errors.length > 0) {
      html += `<div>
        <div class="block-title" style="color:var(--error)">Erros por etapa</div>
        <div class="error-list">
          ${errors.map(e => `
            <div class="error-item">
              <div class="error-step">${esc(e.step)}</div>
              <div class="error-msg">${esc(e.error)}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }

    html += `
      <details>
        <summary>JSON completo</summary>
        <pre>${esc(JSON.stringify(data, null, 2))}</pre>
      </details>
    `;

    panel.innerHTML = html;
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
